services:
  - type: web
    name: icn58
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: node server.js
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: icn58-db
          property: connectionString
      - key: APP_PASSWORD
        sync: false
databases:
  - name: icn58-db
    plan: free
